<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Post Workout Survey</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap" rel="stylesheet"/>

<script>
    tailwind.config = {
        darkMode: "class", // สำคัญมาก
        theme: {
            extend: {
                colors: {
                    "primary": "#f48c25",
                    "brand-blue": "#007BFF",
                },
                fontFamily: { "display": ["Lexend"] }
            },
        },
    }
</script>

<script>
    (function() {
        try {
            const data = JSON.parse(localStorage.getItem("aiExerciseApp"));
            if (data && data.user && data.user.darkMode) {
                document.documentElement.classList.add("dark");
            }
        } catch (e) {}
    })();
</script>

<style>
    body { font-family: 'Lexend', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .filled-icon { font-variation-settings: 'FILL' 1; }
</style>
</head>

<body class="bg-slate-100 dark:bg-slate-900 font-sans min-h-screen flex justify-center transition-colors duration-300">

<div class="w-full max-w-[430px] min-h-screen bg-white dark:bg-slate-800 shadow-xl border-x border-slate-200 dark:border-slate-700 flex flex-col relative transition-colors duration-300">

    <div class="flex items-center px-6 py-4 bg-white dark:bg-slate-800 border-b border-slate-100 dark:border-slate-700 sticky top-0 z-10">
        <div class="text-slate-800 dark:text-white flex size-12 shrink-0 items-center justify-start cursor-pointer">
            <span class="material-symbols-outlined" onclick="history.back()">arrow_back_ios</span>
        </div>
        <h2 class="text-slate-800 dark:text-white text-lg font-bold leading-tight flex-1 text-center pr-12">Check-in</h2>
    </div>

    <div class="flex-1 overflow-y-auto pb-24">

        <div class="px-4 mt-6">
            <h2 class="text-slate-900 dark:text-white tracking-tight text-[28px] font-bold leading-tight text-center pb-3 pt-5">
                How tired are you?
            </h2>
            <p class="text-slate-500 dark:text-slate-400 text-center text-sm px-8">
                Rate your exertion level (RPE) for this session.
            </p>
        </div>

        <div class="flex flex-wrap gap-2 px-6 py-8 justify-between">

            <div class="flex flex-col items-center gap-2 cursor-pointer group rating-btn" data-level="1">
                <div class="flex items-center justify-center p-3 rounded-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 group-hover:border-primary transition-colors">
                    <span class="material-symbols-outlined text-slate-400 group-hover:text-primary text-3xl">bolt</span>
                </div>
                <span class="text-[10px] uppercase font-bold text-slate-400">Easy</span>
            </div>

            <div class="flex flex-col items-center gap-2 cursor-pointer group rating-btn" data-level="2">
                <div class="flex items-center justify-center p-3 rounded-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 group-hover:border-primary transition-colors">
                    <span class="material-symbols-outlined text-slate-400 group-hover:text-primary text-3xl">sentiment_satisfied</span>
                </div>
                <span class="text-[10px] uppercase font-bold text-slate-400">Light</span>
            </div>

            <div class="flex flex-col items-center gap-2 cursor-pointer group rating-btn" data-level="3">
                <div class="flex items-center justify-center p-3 rounded-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 group-hover:border-primary transition-colors">
                    <span class="material-symbols-outlined text-slate-400 group-hover:text-primary text-3xl">water_drop</span>
                </div>
                <span class="text-[10px] uppercase font-bold text-slate-400">Moderate</span>
            </div>

            <div class="flex flex-col items-center gap-2 cursor-pointer group rating-btn" data-level="4">
                <div class="flex items-center justify-center p-3 rounded-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 group-hover:border-primary transition-colors">
                    <span class="material-symbols-outlined text-slate-400 group-hover:text-primary text-3xl">fitness_center</span>
                </div>
                <span class="text-[10px] uppercase font-bold text-slate-400">Hard</span>
            </div>

            <div class="flex flex-col items-center gap-2 cursor-pointer group rating-btn" data-level="5">
                <div class="flex items-center justify-center p-3 rounded-full bg-primary/20 border-2 border-primary">
                    <span class="material-symbols-outlined text-primary text-3xl filled-icon">battery_0_bar</span>
                </div>
                <span class="text-[10px] uppercase font-bold text-primary">Max</span>
            </div>
        </div>

        <div class="flex flex-col gap-4 px-4 py-3">
            <label class="flex flex-col min-w-40 flex-1">
                <p class="text-slate-800 dark:text-white text-base font-medium leading-normal pb-2">Notes (Optional)</p>
                <textarea class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl
                    text-slate-800 dark:text-white bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600
                    focus:outline-0 focus:ring-2 focus:ring-primary min-h-36 placeholder:text-slate-400 p-4 text-base"
                    placeholder="Any pain or specific feelings?"></textarea>
            </label>
        </div>

        <div class="px-4 py-6">
            <button id="submitBtn" class="w-full bg-primary text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 active:scale-95 transition-transform">
                COMPLETE WORKOUT
            </button>
        </div>
    </div>
</div>

<script>
let tirednessLevel = 5;

const btns = document.querySelectorAll(".rating-btn");

function updateUI() {
    btns.forEach((btn, index) => {
        const level = index + 1;
        const circle = btn.querySelector("div");
        const icon = btn.querySelector("span.material-symbols-outlined");
        const label = btn.querySelector("span:last-child");

        // Reset Styles
        circle.className = "flex items-center justify-center p-3 rounded-full transition-colors bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 group-hover:border-primary";
        icon.className = "material-symbols-outlined text-3xl text-slate-400 group-hover:text-primary";
        icon.style.fontVariationSettings = "'FILL' 0";
        label.className = "text-[10px] uppercase font-bold text-slate-400";

        // Apply Active Style
        if (level === tirednessLevel) {
            circle.className = "flex items-center justify-center p-3 rounded-full border-2 border-primary bg-primary/20";
            icon.className = "material-symbols-outlined text-3xl text-primary";
            icon.style.fontVariationSettings = "'FILL' 1";
            label.className = "text-[10px] uppercase font-bold text-primary";
        }
    });
}

btns.forEach((btn, index) => {
    btn.onclick = () => {
        tirednessLevel = index + 1;
        updateUI();
    };
});

// Initialize UI
updateUI();

document.getElementById("submitBtn").onclick = () => {
    const note = document.querySelector("textarea").value;
    const lastResult = JSON.parse(localStorage.getItem("lastResult")) || {};

    const feedbackData = {
        sessionId: lastResult.sessionNo,
        exercise: lastResult.exerciseName,
        tiredness: tirednessLevel,
        note: note,
        timestamp: Date.now()
    };

    const history = JSON.parse(localStorage.getItem("feedbackHistory")) || [];
    history.push(feedbackData);
    localStorage.setItem("feedbackHistory", JSON.stringify(history));

    location.href = "5.html";
};
</script>

</body>
</html>
