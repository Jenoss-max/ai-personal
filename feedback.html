<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Post Workout Survey</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap" rel="stylesheet"/>

<script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "primary": "#f48c25",
                    "brand-blue": "#007BFF",
                },
                fontFamily: { "display": ["Lexend"] }
            },
        },
    }
</script>

<script>
    (function() {
        try {
            const data = JSON.parse(localStorage.getItem("aiExerciseApp"));
            if (data && data.user && data.user.darkMode) {
                document.documentElement.classList.add("dark");
            }
        } catch (e) {}
    })();
</script>

<style>
    body { font-family: 'Lexend', sans-serif; }
    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        font-size: 24px !important;
        line-height: 1;
    }
    .filled-icon { font-variation-settings: 'FILL' 1; }
</style>
</head>

<body class="bg-slate-50 dark:bg-slate-900 font-sans min-h-screen flex justify-center transition-colors duration-300">

<div class="w-full max-w-[430px] min-h-screen bg-white dark:bg-slate-900 shadow-xl border-x border-slate-100 dark:border-slate-800 flex flex-col relative transition-colors duration-300">

    <header class="flex items-center justify-center px-6 py-5 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-100 dark:border-slate-800 sticky top-0 z-20">
        <h1 class="text-lg font-extrabold tracking-tight text-slate-900 dark:text-white uppercase">Session Check-in</h1>
    </header>

    <div class="flex-1 overflow-y-auto pb-24 px-6">

        <div class="mt-6 mb-6 text-center">
            <h2 class="text-2xl font-bold text-slate-800 dark:text-white">How tired are you?</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Rate your exertion level (RPE)</p>
        </div>

        <div class="flex flex-col gap-3">
            <button class="rating-btn w-full p-3 rounded-2xl border-2 flex items-center gap-4 transition-all duration-200 group bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:border-primary/50" data-level="1">
                <div class="w-12 h-12 min-w-[3rem] rounded-xl flex items-center justify-center bg-white dark:bg-slate-700 shadow-sm transition-colors overflow-hidden shrink-0">
                    <span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">😌</span>
                </div>
                <div class="flex-1 text-left min-w-0">
                    <p class="font-bold text-slate-700 dark:text-slate-200 text-lg group-hover:text-primary transition-colors truncate">Easy</p>
                    <p class="text-[10px] text-slate-400 dark:text-slate-500 truncate"> No sweat, very comfortable</p>
                </div>
                <div class="radio-circle w-6 h-6 rounded-full border-2 border-slate-300 dark:border-slate-600 flex items-center justify-center shrink-0">
                    <div class="w-3 h-3 rounded-full bg-primary opacity-0 transition-opacity"></div>
                </div>
            </button>

            <button class="rating-btn w-full p-3 rounded-2xl border-2 flex items-center gap-4 transition-all duration-200 group bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:border-primary/50" data-level="2">
                <div class="w-12 h-12 min-w-[3rem] rounded-xl flex items-center justify-center bg-white dark:bg-slate-700 shadow-sm transition-colors overflow-hidden shrink-0">
                    <span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">🙂</span>
                </div>
                <div class="flex-1 text-left min-w-0">
                    <p class="font-bold text-slate-700 dark:text-slate-200 text-lg group-hover:text-primary transition-colors truncate">Light</p>
                    <p class="text-[10px] text-slate-400 dark:text-slate-500 truncate"> Breathing deeper, still easy</p>
                </div>
                <div class="radio-circle w-6 h-6 rounded-full border-2 border-slate-300 dark:border-slate-600 flex items-center justify-center shrink-0">
                    <div class="w-3 h-3 rounded-full bg-primary opacity-0 transition-opacity"></div>
                </div>
            </button>

            <button class="rating-btn w-full p-3 rounded-2xl border-2 flex items-center gap-4 transition-all duration-200 group bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:border-primary/50" data-level="3">
                <div class="w-12 h-12 min-w-[3rem] rounded-xl flex items-center justify-center bg-white dark:bg-slate-700 shadow-sm transition-colors overflow-hidden shrink-0">
                    <span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">😓</span>
                </div>
                <div class="flex-1 text-left min-w-0">
                    <p class="font-bold text-slate-700 dark:text-slate-200 text-lg group-hover:text-primary transition-colors truncate">Moderate</p>
                    <p class="text-[10px] text-slate-400 dark:text-slate-500 truncate"> Sweating, can hold conversation</p>
                </div>
                <div class="radio-circle w-6 h-6 rounded-full border-2 border-slate-300 dark:border-slate-600 flex items-center justify-center shrink-0">
                    <div class="w-3 h-3 rounded-full bg-primary opacity-0 transition-opacity"></div>
                </div>
            </button>

            <button class="rating-btn w-full p-3 rounded-2xl border-2 flex items-center gap-4 transition-all duration-200 group bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:border-primary/50" data-level="4">
                <div class="w-12 h-12 min-w-[3rem] rounded-xl flex items-center justify-center bg-white dark:bg-slate-700 shadow-sm transition-colors overflow-hidden shrink-0">
                    <span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">😫</span>
                </div>
                <div class="flex-1 text-left min-w-0">
                    <p class="font-bold text-slate-700 dark:text-slate-200 text-lg group-hover:text-primary transition-colors truncate">Hard</p>
                    <p class="text-[10px] text-slate-400 dark:text-slate-500 truncate"> Heavy breathing, challenging</p>
                </div>
                <div class="radio-circle w-6 h-6 rounded-full border-2 border-slate-300 dark:border-slate-600 flex items-center justify-center shrink-0">
                    <div class="w-3 h-3 rounded-full bg-primary opacity-0 transition-opacity"></div>
                </div>
            </button>

            <button class="rating-btn w-full p-3 rounded-2xl border-2 flex items-center gap-4 transition-all duration-200 group bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 hover:border-primary/50" data-level="5">
                <div class="w-12 h-12 min-w-[3rem] rounded-xl flex items-center justify-center bg-white dark:bg-slate-700 shadow-sm transition-colors overflow-hidden shrink-0">
                    <span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors filled-icon">🥵</span>
                </div>
                <div class="flex-1 text-left min-w-0">
                    <p class="font-bold text-slate-700 dark:text-slate-200 text-lg group-hover:text-primary transition-colors truncate">Max Effort</p>
                    <p class="text-[10px] text-slate-400 dark:text-slate-500 truncate"> Exhausted, limit reached</p>
                </div>
                <div class="radio-circle w-6 h-6 rounded-full border-2 border-slate-300 dark:border-slate-600 flex items-center justify-center shrink-0">
                    <div class="w-3 h-3 rounded-full bg-primary opacity-0 transition-opacity"></div>
                </div>
            </button>
        </div>

        <div class="mt-8">
            <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2 pl-1">Notes (Optional)</label>
            <textarea class="w-full h-24 rounded-2xl bg-slate-50 dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 focus:border-primary focus:ring-0 text-slate-800 dark:text-white placeholder-slate-400 p-4 resize-none transition-all"
                placeholder="How did you feel? Any pain?"></textarea>
        </div>

    </div>

    <div class="p-6 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 sticky bottom-0 z-20">
        <button id="submitBtn" class="w-full h-14 bg-primary hover:bg-orange-600 text-white font-bold rounded-2xl shadow-lg shadow-orange-500/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
            COMPLETE SESSION <span class="material-symbols-outlined">check</span>
        </button>
    </div>
</div>

<script>
// -------------------------------------------------------------
// 🔴🔴🔴 วาง URL ที่คัดลอกมาจาก Apps Script ตรงนี้ 🔴🔴🔴
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx8K0Ys4MhW2CurS2ic9URANtxA4uCSTE-owwGaEP1hxK7ar8l9JF9ey6R3XrAx7Pz5/exec";
// -------------------------------------------------------------

let tirednessLevel = 5; // Default Max
const btns = document.querySelectorAll(".rating-btn");

function updateUI() {
    btns.forEach((btn, index) => {
        const level = index + 1;
        const box = btn.querySelector("div");
        const icon = btn.querySelector(".material-symbols-outlined");
        const title = btn.querySelector("p.font-bold");
        const radioInner = btn.querySelector(".radio-circle div");
        const radioOuter = btn.querySelector(".radio-circle");

        box.classList.remove("border-primary", "bg-primary/10");
        radioOuter.classList.remove("border-primary");
        radioInner.classList.remove("opacity-100");
        radioInner.classList.add("opacity-0");

        if (level === tirednessLevel) {
            btn.classList.add("bg-primary/5", "dark:bg-primary/10", "border-primary");
            btn.classList.remove("border-slate-200", "dark:border-slate-700");
            box.classList.add("border-primary", "bg-primary/10");
            box.classList.remove("bg-white", "dark:bg-slate-700", "border-slate-200", "dark:border-slate-700");
            icon.classList.add("text-primary");
            icon.classList.remove("text-slate-400");
            icon.style.fontVariationSettings = "'FILL' 1";
            title.classList.add("text-primary");
            title.classList.remove("text-slate-700", "dark:text-slate-200");
            radioOuter.classList.add("border-primary");
            radioOuter.classList.remove("border-slate-300", "dark:border-slate-600");
            radioInner.classList.remove("opacity-0");
            radioInner.classList.add("opacity-100");
        } else {
            btn.classList.remove("bg-primary/5", "dark:bg-primary/10", "border-primary");
            btn.classList.add("border-slate-200", "dark:border-slate-700");
            box.classList.remove("border-primary", "bg-primary/10");
            box.classList.add("bg-white", "dark:bg-slate-700", "border-slate-200", "dark:border-slate-700");
            icon.classList.remove("text-primary");
            icon.classList.add("text-slate-400");
            icon.style.fontVariationSettings = "'FILL' 0";
            title.classList.remove("text-primary");
            title.classList.add("text-slate-700", "dark:text-slate-200");
            radioOuter.classList.remove("border-primary");
            radioOuter.classList.add("border-slate-300", "dark:border-slate-600");
        }
    });
}

btns.forEach((btn, index) => {
    btn.onclick = () => {
        tirednessLevel = index + 1;
        updateUI();
    };
});
updateUI();

document.getElementById("submitBtn").onclick = () => {
    const note = document.querySelector("textarea").value;
    const btn = document.getElementById("submitBtn");

    // 1. UI Loading
    btn.innerHTML = `SAVING... <span class="material-symbols-outlined animate-spin">sync</span>`;
    btn.disabled = true;

    // 2. Data Preparation
    const appData = JSON.parse(localStorage.getItem("aiExerciseApp")) || {};
    const lastResult = JSON.parse(localStorage.getItem("lastResult")) || {};

    const feedbackData = {
        sessionId: lastResult.sessionNo,
        exercise: lastResult.exerciseName,
        tiredness: tirednessLevel,
        note: note,
        timestamp: Date.now()
    };

    // Save Local History
    const history = JSON.parse(localStorage.getItem("feedbackHistory")) || [];
    history.push(feedbackData);
    localStorage.setItem("feedbackHistory", JSON.stringify(history));

    // Update workout history with grade/note
    const workoutHistory = JSON.parse(localStorage.getItem("workoutHistory")) || [];
    if(workoutHistory.length > 0) {
        workoutHistory[workoutHistory.length - 1].grade = tirednessLevel;
        workoutHistory[workoutHistory.length - 1].feedbackNote = note;
        localStorage.setItem("workoutHistory", JSON.stringify(workoutHistory));
    }

    // 3. Send to Google Sheet
    if (SCRIPT_URL && SCRIPT_URL.includes("script.google.com")) {
        const payload = {
            User: appData.user ? appData.user.name : "Guest",
            Exercise: lastResult.exerciseName || "Unknown",
            Reps: lastResult.reps || 0,
            Sets: lastResult.sets || 0,
            Time: lastResult.elapsedSec || 0,
            Feedback: `RPE: ${tirednessLevel}/5 - ${note}`
        };

        fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(() => {
            console.log("Sent to Sheet");
            goHome();
        })
        .catch(e => {
            console.error("Error", e);
            goHome();
        });
    } else {
        goHome();
    }
};

function goHome() {
    setTimeout(() => {
        location.href = "5.html";
    }, 1000);
}
</script>

</body>
</html>
