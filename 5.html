<script>
/* =========================
   CONFIG
========================= */
const APP_KEY = "aiExerciseApp";
const EXERCISE_JSON = "./exercises.json";

/* =========================
   GUARD: ต้องมี user
========================= */

const appData = JSON.parse(localStorage.getItem(APP_KEY));
if (!appData || !appData.user) {
  window.location.href = "2.html";
}
/* =========================
   WELCOME USER NAME
========================= */
const welcomeEl = document.getElementById("welcomeName");

if (welcomeEl && appData.user?.name) {
  welcomeEl.innerText = `Hi!  ${appData.user.name}👋`;
}

/* =========================
   TODAY'S GOAL (REAL DATA)
========================= */

const DAILY_TARGET_MIN = 60;   // เป้าหมายเวลา / วัน
const DAILY_TARGET_KCAL = 400; // เป้าหมาย kcal / วัน

const history = JSON.parse(localStorage.getItem("workoutHistory")) || [];

// เอาเฉพาะของ "วันนี้"
const todayKey = new Date().toDateString();

const todaySessions = history.filter(h =>
  new Date(h.timestamp).toDateString() === todayKey
);

// รวมเวลา (วินาที → นาที)
const totalSec = todaySessions.reduce(
  (sum, s) => sum + (s.elapsedSec || 0), 0
);
const totalMin = Math.floor(totalSec / 60);

// รวม kcal (ถ้าไม่มี kcal → คำนวณคร่าว ๆ)
const totalKcal = Math.round(
  todaySessions.reduce((sum, s) => {
    if (s.kcal) return sum + s.kcal;
    // fallback: 8 kcal / นาที (ประมาณ HIIT)
    return sum + ((s.elapsedSec || 0) / 60) * 8;
  }, 0)
);

// % progress
const timePercent = Math.min(100, Math.round((totalMin / DAILY_TARGET_MIN) * 100));
const kcalPercent = Math.min(100, Math.round((totalKcal / DAILY_TARGET_KCAL) * 100));
const overallPercent = Math.max(timePercent, kcalPercent);

// bind UI
document.getElementById("todayMin").innerText = totalMin;
document.getElementById("todayKcal").innerText = totalKcal;

document.getElementById("timeBar").style.width = timePercent + "%";
document.getElementById("kcalBar").style.width = kcalPercent + "%";

document.getElementById("goalPercent").innerText =
  `${overallPercent}% Complete`;

/* =========================
   LOAD EXERCISES
========================= */
async function loadExercises() {
  try {
    const res = await fetch(EXERCISE_JSON);
    if (!res.ok) throw new Error("Cannot load exercises.json");

    const exercises = await res.json();
    renderWorkoutGrid(exercises);

  } catch (err) {
    console.error(err);
    alert("Failed to load exercise data");
  }
}

/* =========================
   RENDER GRID
========================= */
function renderWorkoutGrid(exercises) {
  const grid = document.getElementById("workoutGrid");
  grid.innerHTML = "";

  Object.entries(exercises).forEach(([id, ex]) => {
    const card = document.createElement("div");

    card.className = `
      bg-white p-4 rounded-3xl
      border border-gray-100 shadow-card
      flex flex-col gap-3
      cursor-pointer
      hover:scale-[1.03]
      transition
    `;

    card.innerHTML = `
      <div class="w-12 h-12 rounded-2xl bg-orange-50 flex items-center justify-center text-brand-orange">
        <span class="material-symbols-outlined text-2xl">fitness_center</span>
      </div>

      <div>
        <p class="font-bold text-brand-blue">${ex.label}</p>
        <p class="text-[10px] text-slate-400 font-bold uppercase">
          ${ex.rep}
        </p>
      </div>
    `;

    card.addEventListener("click", () => selectExercise(id, ex));
    grid.appendChild(card);
  });
}

/* =========================
   SELECT EXERCISE
========================= */
function selectExercise(id, ex) {
  const appData = JSON.parse(localStorage.getItem(APP_KEY));

  appData.workout = {
    id: id,
    label: ex.label,
    ruleFile: `./${ex.file}`,
    video: `./assets/videos/${ex.video}`,
    image: `./assets/images/${ex.image}`,
    repType: ex.rep
  };

  localStorage.setItem(APP_KEY, JSON.stringify(appData));

  // ไปหน้า Exercise Setup
  window.location.href = "4.html";
}

/* =========================
   INIT
========================= */
loadExercises();
</script>
