<main class="flex-1 overflow-y-auto px-6 pb-32">

<section class="mb-8">

    <div class="flex items-center justify-between mb-4">
      <h3 class="text-xs font-bold text-brand-blue dark:text-blue-400 uppercase tracking-widest">Today's Goal</h3>
      <span id="goalPercent" class="text-xs font-bold text-brand-orange">0% Complete</span>

    <div class="flex gap-4">

        <p class="text-xl font-black text-brand-blue dark:text-white"><span id="todayKcal">0</span><span class="text-[10px] text-slate-400 uppercase font-bold">kcal</span></p>
        <div class="w-full bg-gray-100 dark:bg-slate-700 h-1.5 rounded-full"><div id="kcalBar" class="bg-brand-orange h-full rounded-full" style="width: 0%;"></div></div>

<div class="flex justify-center items-center gap-1 opacity-20 py-8 select-none">

<button onclick="location.href='5.html'" class="flex flex-col items-center gap-1 nav-active"><span class="material-symbols-outlined">fitness_center</span><span class="text-[10px] font-bold">Workouts</span></button>
<button onclick="location.href='grap.html'" class="flex flex-col items-center gap-1 group text-slate-400 dark:text-slate-500 hover:text-brand-blue dark:hover:text-blue-400 transition-colors"><span class="material-symbols-outlined">analytics</span><span class="text-[10px] font-bold">Analytics</span></button>
<button onclick="location.href='1.html'" class="flex flex-col items-center gap-1 group text-slate-400 dark:text-slate-500 hover:text-brand-blue dark:hover:text-blue-400 transition-colors"><span class="material-symbols-outlined">person</span><span class="text-[10px] font-bold">Profile</span></button>
</nav>
</div>
<script>
const APP_KEY = "aiExerciseApp";
const MOCK_EXERCISES = {
    "squat": { label: "Squat", rep: "12 Reps", file: "squat.json", video: "squat.mp4", image: "squat.png" },
    "pushup": { label: "Push Up", rep: "10 Reps", file: "pushup.json", video: "pushup.mp4", image: "pushup.png" },
    "plank": { label: "Plank", rep: "30 Sec", file: "plank.json", video: "plank.mp4", image: "plank.png" },
    "lunge": { label: "Lunge", rep: "10 Reps", file: "lunge.json", video: "lunge.mp4", image: "lunge.png" },
    "bird_dog": { label: "Bird Dog", rep: "10 Reps", file: "bird_dog.json", video: "bird_dog.mp4", image: "bird_dog.png" }
};

const appData = JSON.parse(localStorage.getItem(APP_KEY));
if (!appData || !appData.user) {
  window.location.href = "6.html"; // Guard: ดีดกลับไปหน้า 6.html
}

const welcomeEl = document.getElementById("welcomeName");
if (welcomeEl && appData.user?.name) { welcomeEl.innerText = `Hi!  ${appData.user.name}👋`; }

const DAILY_TARGET_MIN = 60; const DAILY_TARGET_KCAL = 400;
const history = JSON.parse(localStorage.getItem("workoutHistory")) || [];
const todayKey = new Date().toDateString();
const todaySessions = history.filter(h => new Date(h.timestamp).toDateString() === todayKey);
const totalSec = todaySessions.reduce((sum, s) => sum + (s.elapsedSec || 0), 0);
const totalMin = Math.floor(totalSec / 60);
const totalKcal = Math.round(todaySessions.reduce((sum, s) => {
    if (s.kcal) return sum + s.kcal;
    return sum + ((s.elapsedSec || 0) / 60) * 8;
}, 0));
const timePercent = Math.min(100, Math.round((totalMin / DAILY_TARGET_MIN) * 100));
const kcalPercent = Math.min(100, Math.round((totalKcal / DAILY_TARGET_KCAL) * 100));
const overallPercent = Math.max(timePercent, kcalPercent);

document.getElementById("todayMin").innerText = totalMin;
document.getElementById("todayKcal").innerText = totalKcal;
document.getElementById("timeBar").style.width = timePercent + "%";
document.getElementById("kcalBar").style.width = kcalPercent + "%";
document.getElementById("goalPercent").innerText = `${overallPercent}% Complete`;

function renderWorkoutGrid() {
  const grid = document.getElementById("workoutGrid");
  grid.innerHTML = "";
  Object.entries(MOCK_EXERCISES).forEach(([id, ex]) => {
    const card = document.createElement("div");
    card.className = `bg-white dark:bg-slate-800 p-4 rounded-3xl border border-gray-100 dark:border-slate-700 shadow-card flex flex-col gap-3 cursor-pointer hover:scale-[1.03] transition`;
    card.innerHTML = `
      <div class="w-12 h-12 rounded-2xl bg-orange-50 dark:bg-slate-700 flex items-center justify-center text-brand-orange">
        <span class="material-symbols-outlined text-2xl">fitness_center</span>
      </div>
      <div>
        <p class="font-bold text-brand-blue dark:text-blue-400">${ex.label}</p>
        <p class="text-[10px] text-slate-400 font-bold uppercase">${ex.rep}</p>
      </div>
    `;
    card.addEventListener("click", () => selectExercise(id, ex));
    grid.appendChild(card);
  });
}

function selectExercise(id, ex) {
  const appData = JSON.parse(localStorage.getItem(APP_KEY));
  appData.workout = { id: id, label: ex.label, ruleFile: `./${ex.file}`, video: `./assets/videos/${ex.video}`, image: `./assets/images/${ex.image}`, repType: ex.rep };
  localStorage.setItem(APP_KEY, JSON.stringify(appData));
  window.location.href = "4.html";
}
renderWorkoutGrid();
</script>
