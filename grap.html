<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Analytics</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { "brand-blue": "#007BFF" }, fontFamily: { sans: ["Inter"] } } } }
</script>
<script>
    (function() {
        try {
            const data = JSON.parse(localStorage.getItem("aiExerciseApp"));
            if (data && data.user && data.user.darkMode) document.documentElement.classList.add("dark");
        } catch(e) {}
    })();
</script>
<style> body { @apply bg-slate-50 dark:bg-slate-900 transition-colors duration-300; } </style>
</head>
<body class="flex justify-center min-h-screen text-slate-900 dark:text-white font-sans">
<div class="w-full max-w-[430px] bg-white dark:bg-slate-900 shadow-xl flex flex-col border-x dark:border-slate-800">
    <header class="px-6 py-4 border-b dark:border-slate-800 flex justify-between bg-white dark:bg-slate-900 sticky top-0 z-10">
        <h1 class="text-sm font-extrabold uppercase text-brand-blue dark:text-blue-400">Analytics</h1>
        <span class="material-symbols-outlined text-brand-blue dark:text-blue-400">analytics</span>
    </header>
    <main class="flex-1 px-6 pt-6 space-y-6">
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-slate-50 dark:bg-slate-800 p-4 rounded-2xl"><p class="text-xs text-gray-400 font-bold uppercase">Sessions</p><p class="text-3xl font-black" id="totalSess">0</p></div>
            <div class="bg-slate-50 dark:bg-slate-800 p-4 rounded-2xl"><p class="text-xs text-gray-400 font-bold uppercase">Mins</p><p class="text-3xl font-black" id="totalMin">0</p></div>
        </div>

        <div id="toggleContainer" class="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
            <button class="flex-1 py-2 text-xs font-bold rounded-lg bg-white dark:bg-slate-700 text-brand-blue dark:text-white shadow-sm transition-all" onclick="setMode('daily', this)">Daily</button>
            <button class="flex-1 py-2 text-xs font-medium rounded-lg text-slate-500 hover:text-slate-700 dark:hover:text-slate-300" onclick="setMode('weekly', this)">Weekly</button>
        </div>

        <div class="border dark:border-slate-700 rounded-2xl p-4 bg-white dark:bg-slate-800">
            <h2 class="text-sm font-bold mb-4">Activity</h2>
            <canvas id="chart"></canvas>
        </div>
    </main>
    <nav class="border-t dark:border-slate-800 px-8 py-3 flex justify-between bg-white dark:bg-slate-900 mt-auto sticky bottom-0">
        <a href="5.html" class="flex flex-col items-center text-gray-400 dark:text-slate-500"><span class="material-symbols-outlined">fitness_center</span><span class="text-[10px] font-bold">Workouts</span></a>
        <a href="grap.html" class="flex flex-col items-center text-brand-blue dark:text-blue-400"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">analytics</span><span class="text-[10px] font-bold">Analytics</span></a>
        <a href="1.html" class="flex flex-col items-center text-gray-400 dark:text-slate-500"><span class="material-symbols-outlined">person</span><span class="text-[10px] font-bold">Profile</span></a>
    </nav>
</div>
<script>
    const hist = JSON.parse(localStorage.getItem("workoutHistory")) || [];
    document.getElementById("totalSess").innerText = hist.length;
    document.getElementById("totalMin").innerText = Math.floor(hist.reduce((a,b)=>a+(b.elapsedSec||0),0)/60);

    let chart;
    function renderChart(mode) {
        // Mock logic for demo (Real logic in previous step)
        const labels = hist.map((_,i)=>`S${i+1}`);
        const data = hist.map(h=>Math.round((h.elapsedSec||0)/60));

        if(chart) chart.destroy();
        chart = new Chart(document.getElementById("chart"), {
            type: 'bar',
            data: { labels, datasets: [{ label:'Mins', data, backgroundColor:'#3b82f6', borderRadius:4 }] },
            options: { scales: { y: { beginAtZero:true, grid:{color:'#e2e8f0'} }, x: { grid:{display:false} } } }
        });
    }

    function setMode(mode, btn) {
        const btns = document.querySelectorAll("#toggleContainer button");
        btns.forEach(b => { b.className = "flex-1 py-2 text-xs font-medium rounded-lg text-slate-500 hover:text-slate-700 dark:hover:text-slate-300"; });
        btn.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-white dark:bg-slate-700 text-brand-blue dark:text-white shadow-sm transition-all";
        renderChart(mode);
    }
    renderChart('daily');
</script>
</body>
</html>
