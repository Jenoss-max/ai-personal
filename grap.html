<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Workout Analytics</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        "wireframe-bg": "#F8FAFC",
        "wireframe-stroke": "#E2E8F0",
        "wireframe-text": "#0F172A",
        "wireframe-subtext": "#64748B",
        "brand-blue": "#007BFF",
        "brand-orange": "#FF8C00",
      },
      fontFamily: { sans: ["Inter", "sans-serif"] }
    }
  }
}
</script>

<script>
    (function() {
        try {
            const data = JSON.parse(localStorage.getItem("aiExerciseApp"));
            if (data && data.user && data.user.darkMode) {
                document.documentElement.classList.add("dark");
            }
        } catch (e) {}
    })();
</script>

<style>
body {
  min-height: max(884px, 100dvh);
}
</style>
</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white font-sans antialiased
             min-h-screen flex justify-center transition-colors duration-300">

<div class="w-full max-w-[430px] min-h-screen
            bg-white dark:bg-slate-900 shadow-xl border-x border-slate-200 dark:border-slate-800
            flex flex-col relative transition-colors duration-300">

<header class="flex items-center justify-between px-6 py-4 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-20">
  <h1 class="text-sm font-extrabold uppercase tracking-widest text-brand-blue dark:text-blue-400">
    Analytics
  </h1>
  <span class="material-symbols-outlined text-brand-blue dark:text-blue-400">analytics</span>
</header>

<main class="flex-1 px-6 pt-6 pb-24 flex flex-col gap-6">

<div class="grid grid-cols-3 gap-3 mb-2">
  <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 text-center shadow-sm">
    <p class="text-xs text-slate-500 dark:text-slate-400 uppercase">Sessions</p>
    <p id="totalSessions" class="text-2xl font-black dark:text-white">0</p>
  </div>
  <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 text-center shadow-sm">
    <p class="text-xs text-slate-500 dark:text-slate-400 uppercase">Total Min</p>
    <p id="totalMinutes" class="text-2xl font-black dark:text-white">0</p>
  </div>
  <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 text-center shadow-sm">
    <p class="text-xs text-slate-500 dark:text-slate-400 uppercase">Total Reps</p>
    <p id="totalReps" class="text-2xl font-black dark:text-white">0</p>
  </div>
</div>

<div id="toggleContainer" class="flex w-full rounded-xl bg-slate-100 dark:bg-slate-800 p-1">
  <button id="btnDaily" class="flex flex-1 items-center justify-center rounded-lg bg-white dark:bg-slate-600 py-2 text-xs font-bold text-brand-blue dark:text-white shadow-sm transition-all" onclick="setMode('daily', this)">Daily</button>
  <button id="btnWeekly" class="flex flex-1 items-center justify-center rounded-lg bg-transparent py-2 text-xs font-medium text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-all" onclick="setMode('weekly', this)">Weekly</button>
  <button id="btnMonthly" class="flex flex-1 items-center justify-center rounded-lg bg-transparent py-2 text-xs font-medium text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-all" onclick="setMode('monthly', this)">Monthly</button>
</div>

<div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-4 shadow-sm">
  <h2 id="chartTitle" class="text-sm font-bold mb-2 dark:text-white">
    Workout Time (Minutes)
  </h2>
  <div class="relative h-48 w-full">
    <canvas id="workoutChart"></canvas>
  </div>
</div>

<div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-4 shadow-sm">
  <div class="flex justify-between items-center mb-2">
    <h2 class="text-sm font-bold dark:text-white">Weight Progress</h2>
    <span class="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold dark:bg-green-900/30 dark:text-green-400">Goal: <span id="goalWeightDisplay">--</span> kg</span>
  </div>
  <div class="relative h-48 w-full">
    <canvas id="weightChart"></canvas>
  </div>
</div>

</main>

<footer class="fixed bottom-0 left-0 right-0 max-w-[430px] mx-auto bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 px-6 py-4 z-30">
  <button onclick="location.href='5.html'"
    class="w-full h-12 bg-brand-blue dark:bg-blue-600 hover:bg-blue-600 dark:hover:bg-blue-500 text-white font-bold rounded-xl transition-colors">
    Back to Home
  </button>
</footer>

<script>
/* ---------- DATA LOADING ---------- */
const APP_KEY = "aiExerciseApp";
const appData = JSON.parse(localStorage.getItem(APP_KEY)) || {};
const history = JSON.parse(localStorage.getItem("workoutHistory")) || [];

// ดึงข้อมูลเป้าหมายน้ำหนัก
const userGoal = appData.user ? appData.user.goalWeight : 0;
const userCurrentWeight = appData.user ? appData.user.weight : 0;
document.getElementById("goalWeightDisplay").innerText = userGoal || "--";

/* ---------- SUMMARY STATS ---------- */
document.getElementById("totalSessions").innerText = history.length;
document.getElementById("totalMinutes").innerText =
  Math.floor(history.reduce((s, x) => s + (x.elapsedSec || 0), 0) / 60);
document.getElementById("totalReps").innerText =
  history.reduce((s, x) => s + (x.reps || 0), 0);

/* ---------- UTIL: DATE GROUPING ---------- */
function getWeekKey(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 4 - (d.getDay() || 7));
  const yearStart = new Date(d.getFullYear(),0,1);
  const week = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return `${d.getFullYear()}-W${week}`;
}

function groupData(mode) {
  const map = {};
  history.forEach(s => {
    let key;
    const d = new Date(s.timestamp);
    if (mode === "daily") {
      key = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    } else if (mode === "weekly") {
      key = getWeekKey(d);
    } else {
      key = d.toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
    }
    map[key] = (map[key] || 0) + Math.round((s.elapsedSec || 0) / 60);
  });
  return map;
}

/* ---------- CHART CONFIG ---------- */
const isDark = document.documentElement.classList.contains('dark');
const gridColor = isDark ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 0, 0, 0.05)';
const tickColor = isDark ? '#94a3b8' : '#64748b';

let workoutChartInstance;
let weightChartInstance;

function renderWorkoutChart(mode) {
  const map = groupData(mode);
  const labels = Object.keys(map);
  const data = Object.values(map);

  const ctx = document.getElementById("workoutChart").getContext('2d');
  if (workoutChartInstance) workoutChartInstance.destroy();

  workoutChartInstance = new Chart(ctx, {
    type: "bar",
    data: {
      labels: labels.length ? labels : ["No Data"],
      datasets: [{
        label: "Minutes",
        data: data.length ? data : [0],
        backgroundColor: "#007BFF",
        borderRadius: 4,
        barThickness: 12
      }]
    },
    options: {
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: {
            beginAtZero: true,
            grid: { color: gridColor },
            ticks: { color: tickColor, font: {size: 10} }
        },
        x: {
            grid: { display: false },
            ticks: { color: tickColor, font: {size: 10} }
        }
      }
    }
  });
}

/* ---------- WEIGHT CHART (MOCKUP LOGIC) ---------- */
// เนื่องจากระบบยังไม่ได้เก็บประวัติน้ำหนักจริงจัง จึงสร้างข้อมูลจำลองเพื่อให้เห็นภาพกราฟ
function getWeightHistory() {
    // ลองดึงจาก localStorage ถ้ามี (เผื่ออนาคต)
    let history = JSON.parse(localStorage.getItem("weightHistory"));

    // ถ้าไม่มีข้อมูล ให้สร้าง Mock Data ขึ้นมาโดยอิงจากน้ำหนักปัจจุบัน
    if (!history || history.length === 0) {
        const current = parseFloat(userCurrentWeight) || 70;
        const goal = parseFloat(userGoal) || 65;
        // สร้างจุดข้อมูลย้อนหลัง 5 สัปดาห์
        history = [
            { date: "4 weeks ago", weight: current + 2.5 },
            { date: "3 weeks ago", weight: current + 1.8 },
            { date: "2 weeks ago", weight: current + 0.9 },
            { date: "Last week", weight: current + 0.4 },
            { date: "Today", weight: current }
        ];
    }
    return history;
}

function renderWeightChart() {
  const dataPoints = getWeightHistory();
  const labels = dataPoints.map(d => d.date);
  const data = dataPoints.map(d => d.weight);

  // เส้น Goal (เป็นเส้นตรงเท่ากันทุกจุด)
  const goalData = new Array(data.length).fill(userGoal || 65);

  const ctx = document.getElementById("weightChart").getContext('2d');
  if (weightChartInstance) weightChartInstance.destroy();

  weightChartInstance = new Chart(ctx, {
    type: "line",
    data: {
      labels: labels,
      datasets: [
        {
            label: "Weight",
            data: data,
            borderColor: "#FF8C00", // สีส้มตามธีม
            backgroundColor: "rgba(255, 140, 0, 0.1)",
            fill: true,
            tension: 0.4,
            pointRadius: 4,
            pointBackgroundColor: "#fff",
            pointBorderColor: "#FF8C00",
            pointBorderWidth: 2
        },
        {
            label: "Goal",
            data: goalData,
            borderColor: "#10B981", // สีเขียว
            borderDash: [5, 5],
            pointRadius: 0,
            borderWidth: 1,
            fill: false
        }
      ]
    },
    options: {
      maintainAspectRatio: false,
      plugins: {
          legend: {
              display: true,
              labels: { color: tickColor, boxWidth: 10, font: {size: 10} }
          }
      },
      scales: {
        y: {
            grid: { color: gridColor },
            ticks: { color: tickColor, font: {size: 10} }
        },
        x: {
            grid: { display: false },
            ticks: { color: tickColor, font: {size: 10} }
        }
      }
    }
  });
}

/* ---------- TOGGLE LOGIC ---------- */
function setMode(mode, clickedBtn) {
  const buttons = document.querySelectorAll("#toggleContainer button");
  const inactiveClasses = ["bg-transparent", "text-slate-500", "dark:text-slate-400"];
  const activeClasses = ["bg-white", "dark:bg-slate-600", "text-brand-blue", "dark:text-white", "shadow-sm"];

  buttons.forEach(btn => {
    btn.classList.remove(...activeClasses);
    btn.classList.add(...inactiveClasses);
    // ลบ font-bold ออกจาก inactive
    btn.classList.remove("font-bold");
    btn.classList.add("font-medium");
  });

  clickedBtn.classList.remove(...inactiveClasses);
  clickedBtn.classList.add(...activeClasses);
  clickedBtn.classList.remove("font-medium");
  clickedBtn.classList.add("font-bold");

  renderWorkoutChart(mode);
}

/* ---------- INIT ---------- */
// เรียกแสดงผลกราฟทั้งสอง
renderWorkoutChart("daily");
renderWeightChart();

</script>

</div>
</body>
</html>
