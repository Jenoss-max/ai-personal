<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stacked Performance Summary</title>

<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.gstatic.com" rel="preconnect" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        "wireframe-bg": "#F8FAFC",
        "wireframe-stroke": "#E2E8F0",
        "wireframe-text": "#0F172A",
        "wireframe-subtext": "#64748B",
        "brand-blue": "#007BFF",
        "brand-blue-dark": "#0056B3",
        "brand-orange": "#FF8C00",
      },
      fontFamily: { sans: ["Inter", "sans-serif"] }
    }
  }
}
</script>

<style type="text/tailwindcss">
@layer utilities {
  .text-brand-gradient {
    background: linear-gradient(135deg, #FF8C00 0%, #FF5100 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
}
body {
  max-width: 430px;
  margin: 0 auto;
  background-color: #f1f5f9;
  min-height: max(884px, 100dvh);
}
.material-symbols-outlined {
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
}
.filled-icon {
  font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
}
</style>
</head>

<body class="bg-wireframe-bg text-wireframe-text font-sans antialiased overflow-x-hidden flex flex-col min-h-screen border-x border-wireframe-stroke shadow-2xl">

<header class="flex items-center justify-between px-6 py-4 bg-white border-b border-wireframe-stroke sticky top-0 z-20">
  <div class="flex items-center gap-2">
    <span class="material-symbols-outlined text-brand-orange text-2xl font-bold">fitness_center</span>
    <h1 class="text-sm font-extrabold uppercase tracking-widest text-brand-blue">AI Exercise</h1>
  </div>
  <button class="flex items-center justify-center w-8 h-8 rounded-full bg-blue-50 text-brand-blue">
    <span class="material-symbols-outlined text-xl">share</span>
  </button>
</header>

<main class="flex-1 px-6 pt-6 pb-32">

<div class="flex flex-col items-center mb-8">
  <div class="mb-6 px-4 py-1.5 bg-blue-50 rounded-full text-[10px] font-extrabold uppercase tracking-[0.15em] text-brand-blue border border-blue-100">
    Session Complete
  </div>

  <div class="relative mb-6">
    <div class="w-44 h-44 rounded-full border-[12px] border-orange-50 bg-white flex items-center justify-center shadow-xl shadow-orange-100/50">
      <span id="grade" class="text-[10rem] font-black text-brand-gradient leading-none">A</span>
    </div>
    <div class="absolute -bottom-2 right-4 w-11 h-11 bg-brand-blue rounded-full flex items-center justify-center border-4 border-white shadow-md">
      <span class="material-symbols-outlined text-white text-xl filled-icon">check_circle</span>
    </div>
  </div>

  <div class="text-center space-y-1">
    <h2 id="headline" class="text-2xl font-bold text-slate-900">Great Effort!</h2>
    <p id="subtitle" class="text-slate-500 text-sm font-medium tracking-tight"></p>
  </div>
</div>

<div class="flex flex-col gap-3 mb-6">
  <div class="flex items-center justify-between px-6 py-5 bg-white border border-slate-100 rounded-2xl shadow-sm">
    <div class="flex items-center gap-4">
      <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center">
        <span class="material-symbols-outlined text-brand-blue">timer</span>
      </div>
      <span class="text-[11px] uppercase font-bold text-slate-400 tracking-[0.15em]">Time</span>
    </div>
    <span id="time" class="text-2xl font-black text-slate-800">00:00</span>
  </div>

  <div class="flex items-center justify-between px-6 py-5 bg-white border border-slate-100 rounded-2xl shadow-sm">
    <div class="flex items-center gap-4">
      <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center">
        <span class="material-symbols-outlined text-brand-blue">layers</span>
      </div>
      <span class="text-[11px] uppercase font-bold text-slate-400 tracking-[0.15em]">Sets</span>
    </div>
    <span id="sets" class="text-2xl font-black text-slate-800">1</span>
  </div>

  <div class="flex items-center justify-between px-6 py-5 bg-white border border-slate-100 rounded-2xl shadow-sm">
    <div class="flex items-center gap-4">
      <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center">
        <span class="material-symbols-outlined text-brand-blue">repeat</span>
      </div>
      <span class="text-[11px] uppercase font-bold text-slate-400 tracking-[0.15em]">Reps</span>
    </div>
    <span id="reps" class="text-2xl font-black text-slate-800">0</span>
  </div>
</div>

<div class="bg-white border border-slate-100 p-5 rounded-2xl shadow-sm mb-8 flex items-center gap-5">
  <div class="relative flex items-center justify-center flex-shrink-0">
    <svg class="w-16 h-16 -rotate-90">
      <circle cx="32" cy="32" r="28" stroke="#e5e7eb" stroke-width="6" fill="none"/>
      <circle id="ring" cx="32" cy="32" r="28"
        stroke="#FF8C00" stroke-width="6" fill="none"
        stroke-dasharray="175.9" stroke-dashoffset="175.9"
        stroke-linecap="round"/>
    </svg>
  </div>
  <div class="flex-1">
    <div class="flex justify-between mb-1">
      <span class="text-[10px] uppercase font-bold text-slate-400">AI Result</span>
      <span id="accuracy" class="text-lg font-black text-brand-orange">0%</span>
    </div>
    <h3 class="text-sm font-bold">Form Accuracy</h3>
    <p class="text-[11px] text-slate-500">Based on pose tracking</p>
  </div>
</div>

<button onclick="location.href='feedback.html'"
  class="w-full h-14 bg-brand-blue text-white font-bold text-sm uppercase tracking-widest rounded-2xl shadow-lg">
  GIVE FEEDBACK
</button>

</main>

<nav class="fixed bottom-0 left-0 right-0 max-w-[430px] mx-auto bg-white border-t border-slate-100 px-10 pt-3 pb-8 safe-bottom flex justify-between items-center shadow-[0_-4px_15px_rgba(0,0,0,0.05)]">
<button onclick="location.href='5.html'" class="flex flex-col items-center gap-1 nav-active">
  <span class="material-symbols-outlined">fitness_center</span>
  <span class="text-[10px] font-bold">Workouts</span>
</button>
<button onclick="location.href='grap.html'" class="flex flex-col items-center gap-1 group text-slate-400">
  <span class="material-symbols-outlined">analytics</span>
  <span class="text-[10px] font-bold">Analytics</span>
</button>
<button onclick="location.href='1.html'" class="flex flex-col items-center gap-1 group text-slate-400">
  <span class="material-symbols-outlined">person</span>
  <span class="text-[10px] font-bold">Profile</span>
</button>
</nav>

<script>
const result = JSON.parse(localStorage.getItem("lastResult"));
if (!result) location.href = "1.html";

// TIME (mm:ss)
const sec = result.elapsedSec;
const m = Math.floor(sec / 60);
const s = String(sec % 60).padStart(2, "0");
const timeText = `${m}:${s}`;

// ACCURACY
const accuracy = Math.round((result.reps / result.target) * 100);

// GRADE
let grade = "C";
let headline = "Keep Practicing";
if (accuracy >= 90) { grade = "A"; headline = "Excellent Work!"; }
else if (accuracy >= 75) { grade = "B"; headline = "Great Job!"; }

// RENDER
document.getElementById("grade").innerText = grade;
document.getElementById("headline").innerText = headline;
document.getElementById("subtitle").innerText =
  `Session #${result.sessionNo} • ${result.exerciseName} • ${timeText}`;

document.getElementById("time").innerText = timeText;
document.getElementById("sets").innerText = result.sets;
document.getElementById("reps").innerText = result.reps;
document.getElementById("accuracy").innerText = accuracy + "%";

// RING
document.getElementById("ring").style.strokeDashoffset =
  175.9 * (1 - accuracy / 100);
</script>

</body>
</html>
