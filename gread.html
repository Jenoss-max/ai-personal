<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Summary</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                colors: { "brand-blue": "#007BFF", "brand-orange": "#FF8C00" },
                fontFamily: { sans: ["Inter"] }
            }
        }
    }
</script>
<script>
    (function() {
        try {
            const data = JSON.parse(localStorage.getItem("aiExerciseApp"));
            if (data && data.user && data.user.darkMode) document.documentElement.classList.add("dark");
        } catch(e) {}
    })();
</script>
<style type="text/tailwindcss">
    @layer utilities { .text-brand-gradient { background: linear-gradient(135deg, #FF8C00 0%, #FF5100 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; } }
    body { @apply bg-slate-50 dark:bg-slate-900 transition-colors duration-300; }
</style>
</head>
<body class="font-sans flex justify-center min-h-screen text-slate-900 dark:text-white">
<div class="w-full max-w-[430px] bg-white dark:bg-slate-900 shadow-xl flex flex-col p-6 border-x dark:border-slate-800">
    <header class="flex items-center gap-2 py-4 border-b dark:border-slate-800 mb-6">
        <span class="material-symbols-outlined text-brand-orange text-2xl font-bold">fitness_center</span>
        <h1 class="text-sm font-extrabold uppercase text-brand-blue dark:text-blue-400">AI Exercise</h1>
    </header>

    <div class="flex flex-col items-center mb-8">
        <div class="mb-6 px-4 py-1 bg-blue-50 dark:bg-slate-800 rounded-full text-[10px] font-extrabold uppercase text-brand-blue dark:text-blue-400 border border-blue-100 dark:border-slate-700">Session Complete</div>
        <div class="relative mb-6">
            <div class="w-44 h-44 rounded-full border-[12px] border-orange-50 dark:border-slate-800 bg-white dark:bg-slate-800 flex items-center justify-center shadow-xl">
                <span id="grade" class="text-9xl font-black text-brand-gradient dark:text-brand-orange">A</span>
            </div>
        </div>
        <h2 id="headline" class="text-2xl font-bold">Great Job!</h2>
        <p id="sub" class="text-slate-500 dark:text-slate-400 text-sm">Workout Summary</p>
    </div>

    <div class="space-y-3 mb-8">
        <div class="flex justify-between p-4 border dark:border-slate-700 rounded-2xl bg-white dark:bg-slate-800">
            <div class="flex gap-3"><span class="material-symbols-outlined text-brand-blue dark:text-blue-400">timer</span><span class="font-bold text-gray-400 text-xs uppercase pt-1">Time</span></div>
            <span id="time" class="text-xl font-black">0:00</span>
        </div>
        <div class="flex justify-between p-4 border dark:border-slate-700 rounded-2xl bg-white dark:bg-slate-800">
            <div class="flex gap-3"><span class="material-symbols-outlined text-brand-blue dark:text-blue-400">repeat</span><span class="font-bold text-gray-400 text-xs uppercase pt-1">Reps</span></div>
            <span id="reps" class="text-xl font-black">0</span>
        </div>
    </div>

    <button onclick="location.href='feedback.html'" class="w-full h-14 bg-brand-blue dark:bg-blue-600 text-white font-bold rounded-2xl shadow-lg mt-auto">GIVE FEEDBACK</button>
</div>
<script>
    const res = JSON.parse(localStorage.getItem("lastResult"));
    if(!res) location.href="5.html";
    document.getElementById("reps").innerText = res.reps;
    const m = Math.floor(res.elapsedSec/60), s = String(Math.floor(res.elapsedSec%60)).padStart(2,'0');
    document.getElementById("time").innerText = `${m}:${s}`;
    document.getElementById("sub").innerText = res.exerciseName;
    const acc = (res.reps/res.target)*100;
    let g = "C", h = "Keep Going";
    if(acc>=90){g="A";h="Excellent!"} else if(acc>=75){g="B";h="Good Job!"}
    document.getElementById("grade").innerText = g;
    document.getElementById("headline").innerText = h;
</script>
</body>
</html>
