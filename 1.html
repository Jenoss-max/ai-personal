<!DOCTYPE html>
<html lang="en" class="transition-colors duration-300">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

<script src="https://cdn.tailwindcss.com?plugins=forms"></script>

<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        "brand-blue": "#007BFF",
        "brand-light": "#E6F0FF",
      },
      fontFamily: { sans: ["Inter", "sans-serif"] }
    }
  }
}
</script>


</head>

<body class="bg-slate-100 dark:bg-slate-900 text-slate-900 dark:text-slate-100
             font-sans min-h-screen flex justify-center transition-colors">
<div class="w-full max-w-[430px] min-h-screen
            bg-slate-100 dark:bg-slate-900
            shadow-xl border-x border-slate-700
            flex flex-col">

<header class="flex items-center justify-between px-6 py-4 bg-white dark:bg-slate-800 border-b dark:border-slate-700">
  <h1 class="text-sm font-extrabold uppercase tracking-widest text-brand-blue">
    Profile
  </h1>
</header>

<main class="flex-1 px-6 pt-6 pb-28 space-y-6">

<div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border dark:border-slate-700 text-center">
  <div class="w-20 h-20 rounded-full bg-brand-light dark:bg-slate-700 mx-auto flex items-center justify-center text-3xl font-black">
    👤
  </div>
  <h2 class="mt-3 text-xl font-extrabold" id="userName">User</h2>
  <button id="editProfileBtn"
    class="mt-2 px-4 py-1.5 bg-brand-light dark:bg-slate-700 rounded-full text-sm font-bold">
    Edit Profile
  </button>
</div>

<div class="grid grid-cols-3 gap-3">
  <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border dark:border-slate-700 text-center">
    <p class="text-xs text-slate-500">Height</p>
    <p class="text-lg font-extrabold"><span id="height">0</span> cm</p>
  </div>
  <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border dark:border-slate-700 text-center">
    <p class="text-xs text-slate-500">Weight</p>
    <p class="text-lg font-extrabold"><span id="weight">0</span> kg</p>
  </div>
  <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border dark:border-slate-700 text-center">
    <p class="text-xs text-slate-500">Goal</p>
    <p class="text-lg font-extrabold"><span id="goal">0</span> kg</p>
  </div>
</div>

<div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border dark:border-slate-700 space-y-3">
  <div class="flex items-center justify-between">
    <span class="font-semibold">Dark Mode</span>
    <input id="darkToggle" type="checkbox"
      class="w-5 h-5 accent-brand-blue"/>
  </div>

  <button id="signOutBtn"
    class="w-full text-red-500 font-bold text-sm pt-3 border-t dark:border-slate-700">
    Sign Out
  </button>
</div>

</main>

<nav class="fixed bottom-0 left-0 right-0 max-w-[430px] mx-auto bg-white dark:bg-slate-800 border-t dark:border-slate-700 px-10 py-4 flex justify-between">
<button onclick="location.href='5.html'"
  class="flex flex-col items-center gap-1 nav-active">
  <span class="material-symbols-outlined">fitness_center</span>
  <span class="text-[10px] font-bold">Workouts</span>
</button>


<button onclick="location.href='grap.html'"
  class="flex flex-col items-center gap-1 group text-slate-400">
  <span class="material-symbols-outlined">analytics</span>
  <span class="text-[10px] font-bold">Analytics</span>
</button>


<button onclick="location.href='3.html'"
  class="flex flex-col items-center gap-1 group text-slate-400">
  <span class="material-symbols-outlined">person</span>
  <span class="text-[10px] font-bold">Profile</span>
</button>

</nav>

<script>
/* =========================
   LOAD USER FROM CREATE PROFILE
========================= */
const APP_KEY = "aiExerciseApp";
const appData = JSON.parse(localStorage.getItem(APP_KEY));

// guard: ต้องเคย create profile
if (!appData || !appData.user) {
  window.location.href = "2.html";
}

const user = appData.user;


/* ---------- BIND DATA ---------- */
document.getElementById("userName").innerText = user.name || "User";
document.getElementById("height").innerText = user.height ?? 0;
document.getElementById("weight").innerText = user.weight ?? 0;
document.getElementById("goal").innerText = user.goalWeight ?? 0;


/* ---------- EDIT PROFILE (แก้ไขลิงก์ตรงนี้) ---------- */
document.getElementById("editProfileBtn").onclick = () => {
  // ส่งค่า edit=1 เพื่อบอกหน้า 2 ว่าไม่ต้อง Auto-Redirect
  location.href = "2.html?edit=1";
};


/* ---------- DARK MODE ---------- */
const darkToggle = document.getElementById("darkToggle");

if (user.darkMode) {
  document.documentElement.classList.add("dark");
  darkToggle.checked = true;
}

darkToggle.onchange = () => {
  user.darkMode = darkToggle.checked;
  // อัปเดตเฉพาะค่า darkMode ลงใน object เดิม
  appData.user.darkMode = user.darkMode;
  localStorage.setItem(APP_KEY, JSON.stringify(appData));
  document.documentElement.classList.toggle("dark", user.darkMode);
};

/* ---------- SIGN OUT ---------- */
document.getElementById("signOutBtn").onclick = () => {
  localStorage.clear();
  location.href = "2.html"; // กลับไปหน้า Register
};
</script>

</div>
</body>

</html>
