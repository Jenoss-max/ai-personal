<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Exercise Setup</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                fontFamily: { "display": ["Lexend", "sans-serif"] },
                colors: { brand: { orange: '#FF5E00', blue: '#0047AB', 'blue-light': '#E8F1FF', 'blue-border': '#D1E3FF' } }
            }
        }
    }
</script>
<script>
    (function() {
        try {
            const data = JSON.parse(localStorage.getItem("aiExerciseApp"));
            if (data && data.user && data.user.darkMode) document.documentElement.classList.add("dark");
        } catch(e) {}
    })();
</script>
<style type="text/tailwindcss">
    body { @apply bg-slate-50 dark:bg-slate-900 transition-colors duration-300; }
</style>
<style> body { min-height: max(884px, 100dvh); } </style>
</head>
<body class="font-display antialiased flex flex-col items-center text-slate-900 dark:text-white min-h-screen">
<div class="w-full max-w-[430px] min-h-screen bg-white dark:bg-slate-900 flex flex-col relative shadow-2xl overflow-hidden border-x dark:border-slate-800">
    <header class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-gray-100 dark:border-slate-800 px-6 py-4 flex items-center">
        <button onclick="window.location.href='5.html'" class="p-1 -ml-2 text-gray-800 dark:text-white hover:bg-gray-100 dark:hover:bg-slate-800 rounded-full transition-colors">
            <span class="material-symbols-outlined text-2xl">chevron_left</span>
        </button>
        <h1 class="flex-1 text-center font-bold text-lg mr-6" id="exName">Exercise Setup</h1>
    </header>
    <main class="flex-1 overflow-y-auto pb-48">
        <div class="w-full aspect-video relative group overflow-hidden bg-black">
            <img class="w-full h-full object-cover" id="demoImg" />
            <div class="absolute inset-0 bg-black/20 flex items-center justify-center" id="playOverlay">
                <button class="w-16 h-16 bg-brand-orange rounded-full flex items-center justify-center shadow-xl shadow-brand-orange/40 active:scale-95 transition-transform group-hover:scale-110">
                    <span class="material-symbols-outlined text-4xl text-white fill-1" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                </button>
            </div>
        </div>
        <div class="px-6 py-8 space-y-10">
            <section>
                <div class="flex items-end justify-between mb-5">
                    <div><h2 class="text-[11px] font-black text-brand-orange uppercase tracking-widest mb-1">Workout Volume</h2><h3 class="text-xl font-extrabold">Number of Sets</h3></div>
                    <div class="text-4xl font-black text-brand-orange" id="setCountDisplay">4</div>
                </div>
                <div class="flex items-center justify-between bg-gray-50 dark:bg-slate-800 rounded-[24px] p-3 border border-gray-100 dark:border-slate-700">
                    <button id="btnMinus" class="w-14 h-14 flex items-center justify-center bg-brand-orange text-white rounded-2xl shadow-lg active:scale-90 transition-all"><span class="material-symbols-outlined font-bold text-2xl">remove</span></button>
                    <div class="flex-1 flex justify-center px-4"><div class="flex gap-2.5" id="dotsContainer"></div></div>
                    <button id="btnPlus" class="w-14 h-14 flex items-center justify-center bg-brand-orange text-white rounded-2xl shadow-lg active:scale-90 transition-all"><span class="material-symbols-outlined font-bold text-2xl">add</span></button>
                </div>
            </section>
            <section>
                <div class="mb-5"><h2 class="text-[11px] font-black text-brand-blue dark:text-blue-400 uppercase tracking-widest mb-1">Set Intensity</h2><h3 class="text-xl font-extrabold">Time Per Set</h3></div>
                <div class="grid grid-cols-3 gap-3" id="timeGrid"></div>
            </section>
        </div>
    </main>
    <div class="absolute bottom-0 left-0 w-full z-50">
        <div class="px-6 pb-6 pt-4 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md">
            <button id="startBtn" class="w-full bg-brand-orange text-white py-4 rounded-2xl font-black text-lg uppercase tracking-[0.1em] flex items-center justify-center gap-3 shadow-xl active:scale-[0.98] transition-all">Start Workout<span class="material-symbols-outlined fill-1" style="font-variation-settings: 'FILL' 1;">play_circle</span></button>
        </div>
        <nav class="bg-white dark:bg-slate-900 border-t border-gray-100 dark:border-slate-800 flex items-center justify-around py-3 px-4">
            <button onclick="location.href='5.html'" class="flex flex-col items-center gap-1 text-brand-blue dark:text-blue-400"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">fitness_center</span><span class="text-[10px] font-bold">Workouts</span></button>
            <button onclick="location.href='grap.html'" class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500"><span class="material-symbols-outlined">analytics</span><span class="text-[10px] font-bold">Analytics</span></button>
            <button onclick="location.href='1.html'" class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500"><span class="material-symbols-outlined">person</span><span class="text-[10px] font-bold">Profile</span></button>
        </nav>
    </div>
</div>
<script>
    const APP_KEY = "aiExerciseApp";
    const appData = JSON.parse(localStorage.getItem(APP_KEY));
    if(!appData || !appData.workout) window.location.href = "5.html";
    const exercise = appData.workout;

    document.getElementById("exName").innerText = exercise.label;
    const demoImg = document.getElementById("demoImg");
    if(exercise.image) demoImg.src = exercise.image;

    const playBtn = document.querySelector("#playOverlay button");
    if (playBtn && exercise.video) {
        playBtn.onclick = () => {
            const video = document.createElement("video");
            video.src = exercise.video; video.controls = true; video.autoplay = true; video.className = "w-full h-full object-cover";
            demoImg.replaceWith(video);
            document.getElementById("playOverlay").style.display = "none";
        };
    }

    let sets = 4, timePerSet = 45;
    const updateSets = () => {
        document.getElementById("setCountDisplay").innerText = sets;
        const cont = document.getElementById("dotsContainer");
        cont.innerHTML = "";
        for(let i=0; i<6; i++) {
            const d = document.createElement("div");
            d.className = `w-4 h-4 rounded-full ${i<sets ? "bg-brand-orange shadow-sm" : "bg-gray-300 dark:bg-slate-600"}`;
            cont.appendChild(d);
        }
    }
    document.getElementById("btnMinus").onclick = () => { if(sets>1) sets--; updateSets(); };
    document.getElementById("btnPlus").onclick = () => { if(sets<6) sets++; updateSets(); };
    updateSets();

    [30,45,60,90,120,180].forEach(t => {
        const btn = document.createElement("button");
        btn.className = "flex flex-col items-center justify-center py-5 border-2 rounded-2xl transition-all";
        btn.innerHTML = `<span class="text-2xl font-black">${t}</span><span class="text-[10px] font-extrabold uppercase">Sec</span>`;
        btn.onclick = () => { timePerSet = t; renderTime(); };
        document.getElementById("timeGrid").appendChild(btn);
    });
    function renderTime() {
        Array.from(document.getElementById("timeGrid").children).forEach(b => {
            const val = parseInt(b.innerText);
            if(val === timePerSet) b.className = "flex flex-col items-center justify-center py-5 border-2 border-brand-blue dark:border-blue-500 rounded-2xl bg-white dark:bg-slate-800 text-brand-blue dark:text-blue-400";
            else b.className = "flex flex-col items-center justify-center py-5 border-2 border-gray-200 dark:border-slate-700 rounded-2xl bg-white dark:bg-slate-800 text-gray-400 dark:text-slate-500";
        });
    }
    renderTime();

    document.getElementById("startBtn").onclick = () => {
        appData.session = { exerciseId: exercise.id, label: exercise.label, sets, timePerSet, startTime: Date.now() };
        localStorage.setItem(APP_KEY, JSON.stringify(appData));
        window.location.href = "3.html";
    };
</script>
</body>
</html>
