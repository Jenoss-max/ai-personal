<script>
/* =====================================================
   Exercise Setup – CLEAN & STABLE
   (NO DESIGN CHANGE / SINGLE SCRIPT)
===================================================== */

const APP_KEY = "aiExerciseApp";

/* ---------- LOAD & GUARD ---------- */
const appData = JSON.parse(localStorage.getItem(APP_KEY));
if (!appData || !appData.workout) {
  window.location.href = "5.html";
}
const exercise = appData.workout;

/* ---------- STATE ---------- */
let sets = 4;
let timePerSet = 45;

/* ---------- TITLE ---------- */
const titleEl = document.querySelector("header h1");
if (titleEl) titleEl.innerText = exercise.label;

/* ---------- DEMO IMAGE ---------- */
const demoImg = document.querySelector(".aspect-video img");
if (demoImg && exercise.image) demoImg.src = exercise.image;

/* ---------- DISABLE OVERLAY CLICK ---------- */
document
  .querySelectorAll(".aspect-video > div")
  .forEach(el => el.style.pointerEvents = "none");

/* ---------- PLAY VIDEO ---------- */
const playBtn = document.querySelector(".aspect-video button");
if (playBtn && demoImg) {
  playBtn.style.pointerEvents = "auto";
  playBtn.onclick = () => {
    const video = document.createElement("video");
    video.src = exercise.video;
    video.controls = true;
    video.autoplay = true;
    video.playsInline = true;
    video.className = demoImg.className;

    demoImg.replaceWith(video);
    playBtn.style.display = "none";
  };
}

/* ---------- SET COUNT ---------- */
const setCountEl = document.querySelector(".text-4xl.font-black.text-brand-orange");
if (setCountEl) setCountEl.innerText = sets;

/* ---------- SET DOTS ---------- */
const dots = document.querySelectorAll(".flex.gap-2\\.5 > div");
function syncDots() {
  dots.forEach((d, i) => {
    d.className =
      i < sets
        ? "w-4 h-4 rounded-full bg-brand-orange shadow-sm"
        : "w-4 h-4 rounded-full bg-gray-300";
  });
}
syncDots();

/* ---------- PLUS / MINUS ---------- */
document.querySelectorAll("button").forEach(btn => {
  const icon = btn.querySelector(".material-symbols-outlined");
  if (!icon) return;

  if (icon.innerText === "add") {
    btn.onclick = () => {
      if (sets < dots.length) {
        sets++;
        setCountEl.innerText = sets;
        syncDots();
      }
    };
  }

  if (icon.innerText === "remove") {
    btn.onclick = () => {
      if (sets > 1) {
        sets--;
        setCountEl.innerText = sets;
        syncDots();
      }
    };
  }
});

/* ---------- TIME PER SET ---------- */
document.querySelectorAll("button").forEach(btn => {
  const span = btn.querySelector("span.text-2xl");
  if (!span) return;

  const t = Number(span.innerText);
  if (![30,45,60,90,120,180].includes(t)) return;

  btn.onclick = () => {
    timePerSet = t;

    document.querySelectorAll("button").forEach(b => {
      const s = b.querySelector("span.text-2xl");
      if (s && [30,45,60,90,120,180].includes(Number(s.innerText))) {
        b.classList.remove("bg-brand-blue", "text-white");
      }
    });

    btn.classList.add("bg-brand-blue", "text-white");
  };
});

/* ---------- BACK BUTTON ---------- */
/* ---------- BACK BUTTON ---------- */
const backBtn = [...document.querySelectorAll("button")]
  .find(b => b.querySelector(".material-symbols-outlined")?.innerText === "chevron_left");

if (backBtn) {
  backBtn.onclick = () => {
    window.location.href = "5.html";
  };
}


/* ---------- IMPORTANT: UNBLOCK NAV ---------- */
const bottomNav = document.querySelector(".ios-tab-bar");
if (bottomNav) bottomNav.style.pointerEvents = "none";

/* ---------- START WORKOUT (FINAL) ---------- */
const startBtn = [...document.querySelectorAll("button")]
  .find(b => b.textContent.includes("Start Workout"));

if (startBtn) {
  startBtn.type = "button"; // กัน edge case
  startBtn.onclick = () => {
    appData.session = {
      exerciseId: exercise.id,
      label: exercise.label,
      sets,
      timePerSet,
      startTime: Date.now()
    };
    localStorage.setItem(APP_KEY, JSON.stringify(appData));
    window.location.href = "3.html";
  };
}
</script>
