<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Workout</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                colors: { "primary-blue": "#003366", "vibrant-blue": "#0066FF", "vibrant-orange": "#FF6600", "bg-light": "#F8FAFC" },
                fontFamily: { display: ["Lexend"] }, borderRadius: { "2xl": "1.5rem" },
                animation: {
                    'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    'flash-red': 'flashRed 1s infinite'
                },
                keyframes: {
                    flashRed: {
                        '0%, 100%': { borderColor: 'rgba(239, 68, 68, 1)' },
                        '50%': { borderColor: 'rgba(239, 68, 68, 0.3)' },
                    }
                }
            }
        }
    }
</script>
<script>
    (function() {
        try {
            const data = JSON.parse(localStorage.getItem("aiExerciseApp"));
            if (data && data.user && data.user.darkMode) document.documentElement.classList.add("dark");
        } catch(e) {}
    })();
</script>
<style>
    body { font-family: 'Lexend', sans-serif; }
    /* Custom Styles for Alerts */
    .status-good { background-color: rgba(34, 197, 94, 0.9); border-color: #22c55e; color: white; } /* Green */
    .status-bad { background-color: rgba(239, 68, 68, 0.9); border-color: #ef4444; color: white; animation: pulse 1s infinite; } /* Red */
    .status-neutral { background-color: rgba(0, 0, 0, 0.6); border-color: rgba(255,255,255,0.1); color: white; }
</style>
</head>
<body class="bg-bg-light dark:bg-slate-900 text-primary-blue dark:text-white font-display flex justify-center min-h-screen">
<div class="relative w-full max-w-[430px] h-screen flex flex-col overflow-hidden bg-white dark:bg-slate-900">

    <div id="countdownOverlay" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-black/90 backdrop-blur-sm transition-opacity duration-300">
        <h2 id="countdownLabel" class="text-white text-2xl font-bold uppercase tracking-widest mb-4 animate-pulse">Get Ready</h2>
        <div class="relative flex items-center justify-center">
            <div class="absolute w-40 h-40 rounded-full border-4 border-vibrant-orange/30 animate-ping"></div>
            <span id="countdownNum" class="text-8xl font-black text-white drop-shadow-[0_0_15px_rgba(255,102,0,0.8)]">10</span>
        </div>
        <p class="text-gray-300 text-sm mt-8">Position yourself in camera</p>
    </div>

    <div class="px-6 pt-6 pb-2 flex justify-between items-center bg-white dark:bg-slate-900 z-10">
        <span onclick="history.back()" class="material-symbols-outlined cursor-pointer dark:text-white">arrow_back_ios</span>
        <div class="text-center"><h2 class="font-extrabold dark:text-white">Tracking Active</h2><p class="text-vibrant-orange text-[10px] font-bold uppercase" id="exName">Exercise</p></div>
        <span class="material-symbols-outlined dark:text-white">more_horiz</span>
    </div>

    <div class="px-6 py-2 bg-white dark:bg-slate-900 border-b dark:border-slate-800 mb-2">
        <div class="flex justify-between text-[10px] font-bold"><span class="text-gray-400">Progress</span><span id="progressText" class="dark:text-white">0%</span></div>
        <div class="h-2 bg-gray-100 dark:bg-slate-700 rounded-full mt-1"><div id="progressBar" class="h-full bg-vibrant-blue rounded-full w-0"></div></div>
    </div>

    <div class="flex-1 flex flex-col gap-2 px-4 overflow-hidden relative">
        <div class="relative w-full flex-[0.45] bg-black rounded-2xl overflow-hidden shadow-md border border-slate-200 dark:border-slate-700">
            <video id="refVideo" class="w-full h-full object-contain" autoplay loop muted playsinline></video>
            <div class="absolute top-2 left-2 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded font-bold uppercase backdrop-blur-sm">Demo</div>
        </div>

        <div id="cameraWrapper" class="relative w-full flex-1 bg-black rounded-2xl overflow-hidden border-4 border-vibrant-blue shadow-lg transition-colors duration-300">
            <video id="camera" autoplay muted playsinline class="absolute inset-0 w-full h-full object-contain hidden"></video>
            <canvas id="overlay" class="absolute inset-0 w-full h-full object-cover scale-x-[-1]"></canvas>
            <div class="absolute top-2 left-2 bg-vibrant-blue/80 text-white text-[10px] px-2 py-0.5 rounded font-bold uppercase backdrop-blur-sm z-20">You</div>

            <div id="feedbackBox" class="absolute top-2 right-2 bg-black/60 backdrop-blur-md rounded-xl p-3 border border-white/10 z-20 shadow-lg text-right min-w-[140px] transition-all duration-300">
                <div class="flex justify-between items-center mb-1 border-b border-white/20 pb-1">
                    <span class="text-[9px] font-bold text-[#00FF00] tracking-wider opacity-80">AI FEEDBACK</span>
                    <span id="fpsDisplay" class="text-[9px] font-mono text-yellow-400">0 FPS</span>
                </div>

                <div class="flex justify-between items-end mb-2">
                    <span class="text-[9px] text-gray-300">Score</span>
                    <span id="scoreDisplay" class="text-xl font-black text-white">0%</span>
                </div>

                <div id="feedbackContainer" class="mt-1 pt-1 border-t border-white/20 text-center">
                    <span id="feedbackText" class="text-sm font-black uppercase tracking-wider text-white">READY</span>
                </div>
            </div>
        </div>
    </div>

    <div class="px-4 pt-3 pb-2 flex gap-3">
        <div class="flex-1 bg-white dark:bg-slate-800 border dark:border-slate-700 rounded-2xl p-2 text-center"><p class="text-[10px] text-gray-400 uppercase" id="scoreLabel">Total Reps</p><p class="text-2xl font-black dark:text-white" id="repCount">0</p></div>
        <div class="flex-1 bg-white dark:bg-slate-800 border dark:border-slate-700 rounded-2xl p-2 text-center"><p class="text-[10px] text-gray-400 uppercase">Set</p><p class="text-2xl font-black dark:text-white"><span id="setCount">1</span>/<span id="setTotal">1</span></p></div>
        <div class="flex-1 bg-white dark:bg-slate-800 border dark:border-slate-700 rounded-2xl p-2 text-center"><p class="text-[10px] text-gray-400 uppercase">Time</p><p class="text-2xl font-black dark:text-white" id="timer">00:00</p></div>
    </div>

    <div class="px-4 pb-6 flex gap-3">
        <button id="pauseBtn" class="flex-1 h-12 bg-primary-blue dark:bg-blue-600 text-white font-bold rounded-2xl text-sm">Pause</button>
        <button id="endBtn" class="flex-1 h-12 bg-vibrant-orange text-white font-bold rounded-2xl text-sm">End</button>
    </div>
</div>

<script type="module">
    function calculateAngle(a, b, c) {
        const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
        let angle = Math.abs(radians * 180.0 / Math.PI);
        if (angle > 180.0) angle = 360 - angle;
        return angle;
    }

    function drawAngleText(ctx, text, x, y) {
        ctx.save(); ctx.scale(-1, 1); ctx.fillStyle = "white"; ctx.font = "bold 24px Arial"; ctx.strokeStyle = "black"; ctx.lineWidth = 3;
        ctx.strokeText(text, -x * ctx.canvas.width, y * ctx.canvas.height); ctx.fillText(text, -x * ctx.canvas.width, y * ctx.canvas.height); ctx.restore();
    }

    function drawSkeleton(ctx, landmarks, color) {
        ctx.lineWidth = 4; ctx.strokeStyle = color;
        [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]].forEach(([i,j])=>{
            if(landmarks[i].visibility>.5 && landmarks[j].visibility>.5){ ctx.beginPath(); ctx.moveTo(landmarks[i].x*ctx.canvas.width, landmarks[i].y*ctx.canvas.height); ctx.lineTo(landmarks[j].x*ctx.canvas.width, landmarks[j].y*ctx.canvas.height); ctx.stroke(); }
        });
    }

    class PoseEngine {
        constructor(rule, exerciseId) {
            this.exerciseId = (exerciseId || "exercise").toLowerCase();
            this.reps = 0; this.state = "UP"; this.accumulatedTime = 0; this.holdStartTime = null;
            this.bdState = "DOWN"; this.baselineArmY = null; this.baselineLegY = null; this.prevLandmarks = null;
            this.currentScore = 0;
            this.feedbackMessage = "READY";
            this.feedbackStatus = "neutral";
        }
        smooth(landmarks) {
            if (!this.prevLandmarks) { this.prevLandmarks = landmarks; return landmarks; }
            const smoothed = landmarks.map((curr, i) => {
                const prev = this.prevLandmarks[i]; return { x: prev.x*0.5 + curr.x*0.5, y: prev.y*0.5 + curr.y*0.5, z: prev.z*0.5 + curr.z*0.5, visibility: curr.visibility };
            });
            this.prevLandmarks = smoothed; return smoothed;
        }
        process(rawLandmarks, canvasHeight) {
            const landmarks = this.smooth(rawLandmarks);
            let color = "#FF0000";
            const p = { shoulder: landmarks[11], elbow: landmarks[13], wrist: landmarks[15], hip: landmarks[23], knee: landmarks[25], ankle: landmarks[27], l_wrist: landmarks[15], r_wrist: landmarks[16], l_ankle: landmarks[27], r_ankle: landmarks[28] };
            const kneeAngle = calculateAngle(p.hip, p.knee, p.ankle);
            const hipAngle = calculateAngle(p.knee, p.hip, p.shoulder);
            const elbowAngle = calculateAngle(p.shoulder, p.elbow, p.wrist);

            let percentage = 0;

            if (this.exerciseId.includes("plank")) {
                let diff = Math.abs(180 - hipAngle);
                percentage = Math.max(0, 100 - (diff * 2));
                if (hipAngle >= 160) {
                    color = "#00FF00"; this.feedbackMessage = "HOLD IT!"; this.feedbackStatus = "good";
                    if (!this.holdStartTime) this.holdStartTime = Date.now();
                } else {
                    color = "#FF0000";
                    this.feedbackMessage = hipAngle < 160 ? "LIFT HIPS" : "LOWER HIPS";
                    this.feedbackStatus = "bad";
                    if (this.holdStartTime) { this.accumulatedTime += (Date.now() - this.holdStartTime)/1000; this.holdStartTime = null; }
                }
                let cur = this.accumulatedTime; if (this.holdStartTime) cur += (Date.now() - this.holdStartTime)/1000;
                this.reps = Math.floor(cur); this.debugAngle = Math.round(hipAngle); this.debugPoint = p.hip;

            } else if (this.exerciseId.includes("bird_dog")) {
                const ly = p.l_wrist.y*canvasHeight, ry = p.r_wrist.y*canvasHeight, la = p.l_ankle.y*canvasHeight, ra = p.r_ankle.y*canvasHeight;
                if (this.baselineArmY === null) { this.baselineArmY = (ly+ry)/2; this.baselineLegY = (la+ra)/2; }
                const armR = (this.baselineArmY - ry) > 10, armL = (this.baselineArmY - ly) > 10, legR = (this.baselineLegY - ra) > 10, legL = (this.baselineLegY - la) > 10;

                if ((armR && legL) || (armL && legR)) {
                    color = "#00FF00"; percentage = 100; this.feedbackMessage = "GOOD BALANCE"; this.feedbackStatus = "good";
                    if (this.bdState === "DOWN") this.bdState = "UP";
                } else {
                    percentage = 0; this.feedbackMessage = "LIFT ARM & LEG"; this.feedbackStatus = "neutral";
                    if (this.bdState === "UP") { this.reps++; this.bdState = "DOWN"; this.baselineArmY = (ly+ry)/2; this.baselineLegY = (la+ra)/2; }
                }

            } else {
                let angle = kneeAngle, point = p.knee, down = 135, start = 170;
                if (this.exerciseId.includes("pushup")) { angle = elbowAngle; point = p.elbow; down = 100; }

                let range = start - down; let current = start - angle; percentage = (current / range) * 100;
                percentage = Math.min(100, Math.max(0, percentage));

                if (angle <= down + 10) {
                    color = "#00FF00"; this.feedbackMessage = "PERFECT!"; this.feedbackStatus = "good";
                } else {
                    this.feedbackMessage = (this.state === "DOWN") ? "GO LOWER" : "GO DOWN";
                    this.feedbackStatus = (this.state === "DOWN") ? "bad" : "neutral";
                }

                if (angle <= down && this.state === "UP") this.state = "DOWN";
                if (angle >= 160 && this.state === "DOWN") { this.reps++; this.state = "UP"; }
                this.debugAngle = Math.round(angle); this.debugPoint = point;
            }

            this.currentScore = percentage;
            return { landmarks, color, rep: this.reps, debug: {val: this.debugAngle, pt: this.debugPoint}, score: this.currentScore, msg: this.feedbackMessage, status: this.feedbackStatus };
        }
    }

    const APP_KEY = "aiExerciseApp";
    const appData = JSON.parse(localStorage.getItem(APP_KEY)) || { workout: {id:"squat"}, session:{timePerSet:60, sets:1}, user: {name: "Guest"} };
    const exercise = appData.workout;
    const refVideoEl = document.getElementById("refVideo");
    if (exercise.video) refVideoEl.src = exercise.video;

    let targetReps = 12;
    if (exercise.id.includes("plank")) { targetReps = appData.session.timePerSet; document.getElementById("scoreLabel").innerText = "Hold Time (s)"; }
    else { document.getElementById("scoreLabel").innerText = "Total Reps"; }

    let reps = 0, paused = false, timeLeft = appData.session.timePerSet, currentSet = 1, totalSets = appData.session.sets;
    document.getElementById("setTotal").innerText = totalSets;

    // --- COUNTDOWN VARIABLES ---
    let isPrep = true;
    let prepTime = 10;
    const overlayEl = document.getElementById("countdownOverlay");
    const countLabelEl = document.getElementById("countdownLabel");
    const countNumEl = document.getElementById("countdownNum");
    // ---------------------------

    setInterval(() => {
        if (paused) return;

        if (isPrep) {
            prepTime--;
            countNumEl.innerText = prepTime;

            if (prepTime <= 0) {
                isPrep = false;
                overlayEl.style.opacity = "0";
                setTimeout(() => { overlayEl.style.display = "none"; }, 300);
                timeLeft = appData.session.timePerSet;
            }
        } else {
            timeLeft--;
            const m = String(Math.floor(timeLeft/60)).padStart(2,"0"), s = String(timeLeft%60).padStart(2,"0");
            document.getElementById("timer").innerText = `${m}:${s}`;

            if (timeLeft <= 0) {
                if (currentSet >= totalSets) {
                    finishWorkout();
                } else {
                    isPrep = true;
                    prepTime = 10;
                    currentSet++;
                    document.getElementById("setCount").innerText = currentSet;
                    countLabelEl.innerText = "Rest / Next Set";
                    countNumEl.innerText = prepTime;
                    overlayEl.style.display = "flex";
                    setTimeout(() => { overlayEl.style.opacity = "1"; }, 10);
                }
            }
        }
    }, 1000);

    const video = document.getElementById("camera");
    const canvas = document.getElementById("overlay");
    const ctx = canvas.getContext("2d");
    const engine = new PoseEngine({}, exercise.id);
    const pose = new Pose({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}` });
    pose.setOptions({ modelComplexity: 0, smoothLandmarks: true });

    let lastFrameTime = performance.now(); let fps = 0;
    const fpsDisplay = document.getElementById("fpsDisplay");
    const scoreDisplay = document.getElementById("scoreDisplay");
    const feedbackText = document.getElementById("feedbackText");
    const feedbackBox = document.getElementById("feedbackBox");
    const camWrapper = document.getElementById("cameraWrapper");

    pose.onResults(res => {
        if (paused) return;

        // --- FPS CALCULATION ---
        const now = performance.now(); const delta = now - lastFrameTime; lastFrameTime = now;
        fps = fps * 0.9 + (1000 / delta) * 0.1;
        if(fpsDisplay) fpsDisplay.innerText = fps.toFixed(1) + " FPS";
        // -----------------------

        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.save(); ctx.drawImage(res.image, 0, 0, canvas.width, canvas.height); ctx.restore();

        if (res.poseLandmarks) {
            if (isPrep) {
                drawSkeleton(ctx, engine.smooth(res.poseLandmarks), "#FFFFFF");
                if(feedbackText) feedbackText.innerText = "GET READY...";
                if(camWrapper) { camWrapper.className = "relative w-full flex-1 bg-black rounded-2xl overflow-hidden border-4 border-vibrant-blue shadow-lg transition-colors duration-300"; }
                if(feedbackBox) { feedbackBox.className = "absolute top-2 right-2 bg-black/60 backdrop-blur-md rounded-xl p-3 border border-white/10 z-20 shadow-lg text-right min-w-[140px] transition-all duration-300"; }
                return;
            }

            const result = engine.process(res.poseLandmarks, canvas.height);
            drawSkeleton(ctx, result.landmarks, result.color);
            if(result.debug && result.debug.val) drawAngleText(ctx, result.debug.val+"°", result.debug.pt.x, result.debug.pt.y);

            if(scoreDisplay) {
                let s = Math.round(result.score);
                scoreDisplay.innerText = s + "%";
            }

            // --- VISUAL ALERT LOGIC ---
            if(feedbackText) {
                feedbackText.innerText = result.msg;

                if (result.status === "bad") {
                    if(camWrapper) camWrapper.classList.add("border-red-500", "animate-flash-red");
                    if(camWrapper) camWrapper.classList.remove("border-vibrant-blue", "border-green-500");
                    if(feedbackBox) feedbackBox.className = "absolute top-2 right-2 rounded-xl p-3 border z-20 shadow-lg text-right min-w-[140px] transition-all duration-300 status-bad";
                }
                else if (result.status === "good") {
                    if(camWrapper) camWrapper.classList.add("border-green-500");
                    if(camWrapper) camWrapper.classList.remove("border-vibrant-blue", "border-red-500", "animate-flash-red");
                    if(feedbackBox) feedbackBox.className = "absolute top-2 right-2 rounded-xl p-3 border z-20 shadow-lg text-right min-w-[140px] transition-all duration-300 status-good";
                }
                else {
                    if(camWrapper) camWrapper.classList.add("border-vibrant-blue");
                    if(camWrapper) camWrapper.classList.remove("border-green-500", "border-red-500", "animate-flash-red");
                    if(feedbackBox) feedbackBox.className = "absolute top-2 right-2 rounded-xl p-3 border z-20 shadow-lg text-right min-w-[140px] transition-all duration-300 status-neutral";
                }
            }
            // --------------------------

            if (result.rep !== reps) {
                reps = result.rep;
                document.getElementById("repCount").innerText = reps;
                let p = 0;
                if(exercise.id.includes("plank")) p = Math.min(100, Math.round((reps / (totalSets * appData.session.timePerSet))*100));
                else p = Math.min(100, Math.round((reps / (totalSets * targetReps))*100));
                document.getElementById("progressBar").style.width = p+"%";
                document.getElementById("progressText").innerText = p+"%";
            }
        }
    });

    navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } }).then(stream => {
        video.srcObject = stream;
        const cam = new Camera(video, { onFrame: async()=>{ if(!paused) await pose.send({image:video}); }, width: 640, height: 480 });
        cam.start();
    });

    document.getElementById("pauseBtn").onclick = function() {
        paused = !paused; this.innerText = paused ? "Resume" : "Pause";
        if(paused) refVideoEl.pause(); else refVideoEl.play();
    };
    document.getElementById("endBtn").onclick = finishWorkout;

    function finishWorkout() {
        let finalTarget = targetReps * totalSets;
        const result = {
            sessionNo: (JSON.parse(localStorage.getItem("workoutHistory"))||[]).length+1,
            exerciseId: exercise.id, exerciseName: exercise.label,
            reps, target: finalTarget, sets: totalSets,
            elapsedSec: (currentSet-1)*appData.session.timePerSet + (appData.session.timePerSet-timeLeft),
            timestamp: Date.now()
        };
        localStorage.setItem("lastResult", JSON.stringify(result));
        const h = JSON.parse(localStorage.getItem("workoutHistory"))||[]; h.push(result);
        localStorage.setItem("workoutHistory", JSON.stringify(h));

        location.href = "gread.html";
    }
</script>
</body>
</html>
